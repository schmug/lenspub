# Runs the repository's three checks on every pull request. The `gate` job
# exists so branch rulesets can require one stable check name regardless of how
# the Node matrix changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor claimed in README.md, and a current LTS.
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Engine unit tests and schema validation of produced results
        run: npm test

      - name: Validate every JSON example against its schema
        run: npm run validate

      - name: Verify every Markdown cross-reference resolves
        run: npm run check-links

  gate:
    name: gate
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to have succeeded
        run: '[ "${{ needs.checks.result }}" = "success" ] || exit 1'
